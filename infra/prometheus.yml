global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: astra-services
    static_configs:
      - targets:
          - "annealed_optimizer:9100"
          - "repair_controller:9100"
          - "initiation_kernel:9100"
